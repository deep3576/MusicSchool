<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Kingsman Renovations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card">
      <h1>Login</h1>
      <p class="lead">Access your Kingsman portal account.</p>
      <form id="loginForm" class="form">
        <input type="email" name="email" placeholder="Email *" required />
        <input type="password" name="password" placeholder="Password *" required />
        <button type="submit" class="cta">Log In</button>
        <p id="loginMsg" class="form-msg"></p>
      </form>
      <p class="muted">New user? <a href="signup.html">Create an account</a></p>
      <p><a href="index.html">← Back to home</a></p>
    </section>
  </main>
  <script src="static/js/session.js"></script>
  <script src="static/js/auth.js"></script>
</body>
</html>
