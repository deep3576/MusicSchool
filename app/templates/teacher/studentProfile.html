{% extends "base.html" %}
{% block content %}
<section class="page">
    <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
        <div>
            <h1 style="margin:0;">Student Profile</h1>
            <p class="muted" style="margin:6px 0 0;">{{ u.full_name }} · ID {{ u.id }}</p>
        </div>
        <a class="btn secondary" href="{{ url_for('teacher.students') }}">Back</a>
    </div>

    <form method="post" class="card form-card" style="margin-top:12px;">
        <div class="grid">
            <div>
                <label class="label">Email :: {{ u.email or '' }}</label>
            </div>



            <script>
                (function () {
                  const boxes = Array.from(document.querySelectorAll(".role-box"));
                  if (!boxes.length) return;

                  function updateRequired() {
                    const anyChecked = boxes.some(b => b.checked);
                    boxes.forEach(b => b.required = !anyChecked); // requires at least one
                  }

                  boxes.forEach(b => b.addEventListener("change", updateRequired));
                  updateRequired();
                })();
            </script>

            <div>
                <label class="label">First Name :: {{ u.first_name or '' }}</label>
            </div>

            <div>
                <label class="label">Last Name :: {{ u.last_name or '' }}</label>
            </div>

            <div>
                <label class="label">Phone :: {{ u.phone or '' }} </label>
            </div>

            <div>
                {% for c in classes %}
                <label class="label">Assigned Class :: {{ c.label }} </label>
                {% endfor %}
            </div>

            <div>
                <label class="label">Address 1 :: {{ u.address_1 or '' }}</label>
            </div>

            <div>
                <label class="label">Address 2 :: {{ u.address_2 or '' }}</label>
            </div>

            <div>
                <label class="label">City :: {{ u.city or '' }}</label>
            </div>

            <div>
                <label class="label">Province/State :: {{ u.province or '' }}</label>

            </div>

            <div>
                <label class="label">Postal Code :: {{ u.postal_code or '' }}</label>

            </div>

            <div>
                <label class="label">Country :: {{ u.country or '' }}</label>

            </div>
        </div>

<!--        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap;">-->
<!--            <button class="btn" type="submit">Save Changes</button>-->
<!--            <a class="btn secondary" href="{{ url_for('teacher.students') }}">Cancel</a>-->
<!--        </div>-->
    </form>
</section>

<style>
    .form-card{ padding: 12px; }
    .label{ display:block; font-weight:950; margin: 0 0 6px; }
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: 1fr; }
    }
</style>
{% endblock %}
