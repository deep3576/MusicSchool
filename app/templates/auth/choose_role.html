{% extends "base.html" %}
{% block content %}
<section class="page">
  <div class="card" style="max-width:560px; margin: 0 auto;">
    <h1 style="margin-top:0;">Choose your role</h1>
    <p class="muted">You have multiple roles. Select how you want to continue.</p>

    <form method="post" style="margin-top:12px;">
      <div style="display:grid; gap:10px;">
        {% for r in roles %}
          <label class="card" style="padding:12px; display:flex; gap:10px; align-items:center; cursor:pointer;">
            <input type="radio" name="role" value="{{ r }}" required>
            <div>
              <div style="font-weight:800; text-transform:capitalize;">{{ r }}</div>
              <div class="muted" style="font-size:13px;">
                {% if r == "admin" %}Manage users, bookings, settings{% endif %}
                {% if r == "teacher" %}Manage schedule, classes, students{% endif %}
                {% if r == "student" %}Book classes and manage your profile{% endif %}
              </div>
            </div>
          </label>
        {% endfor %}
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:14px;">
        <button class="btn" type="submit">Continue</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
